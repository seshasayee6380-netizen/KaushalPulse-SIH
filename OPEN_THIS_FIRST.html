<!doctype html><html><head><meta charset="utf-8"><title>KaushalPulse</title><style>body{font-family:Segoe UI,Arial,sans-serif;background:#09153b;color:#eef4ff;padding:50px} .box{max-width:760px;margin:auto;background:#111e51;border:1px solid #36539c;border-radius:20px;padding:30px} h1{margin-top:0} code{background:#0b1745;padding:4px 7px;border-radius:6px}</style></head><body><div class="box"><h1>KaushalPulse — Working Prototype</h1><p>1. Run <code>run_backend.bat</code> and keep the terminal window open.</p><p>2. Wait until it says <b>Uvicorn running on http://127.0.0.1:8010</b>.</p><p>3. Open <code>frontend/index.html</code>.</p><p>This build deliberately uses port <b>8010</b> so older KaushalPulse servers on port 8000 cannot interfere.</p></div></body></html>
