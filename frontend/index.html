<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KaushalPulse — Disha for your skills</title>
<style>
:root{--bg:#09153b;--bg2:#101e54;--card:#111e51cc;--stroke:#36539c;--text:#eef4ff;--muted:#9db6ee;--cyan:#55d7ff;--purple:#946bff;--green:#54e4bb;--warn:#ffbf66}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 88% 10%,#243a99 0,#101b55 30%,#09153b 68%,#07112c 100%);min-height:100vh}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid #2b4386;background:#081333ee;overflow:auto}.brand{font-weight:800;font-size:22px;line-height:1.1;margin:6px 10px 22px}.brand span{color:var(--cyan)}.nav-title{font-size:11px;letter-spacing:2px;color:#7294dc;margin:18px 10px 8px}.nav button{display:block;width:100%;border:1px solid transparent;background:none;color:#adc0e9;text-align:left;padding:11px 12px;border-radius:12px;margin:4px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#142a5c;border-color:#2e4c93;color:#fff}.main{padding:24px 28px 100px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.eyebrow{color:#73a0ff;letter-spacing:3px;font-size:12px}.title{font-size:42px;font-weight:800;margin:10px 0 6px}.subtitle{color:var(--muted);font-size:18px}.tenantbar{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid #38559b;border-radius:18px;margin:22px 0;background:#0b1a45dd}.tenantdot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 16px #54e4bb}.tenantmeta{font-size:12px;color:#7fa1e0;text-transform:uppercase;letter-spacing:1.5px}.tenantname{font-weight:800;font-size:16px}.selectors{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}.select,input,textarea{background:#0b1745;color:#fff;border:1px solid #3b58a0;border-radius:12px;padding:12px 14px;min-width:210px;outline:none}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 12;background:linear-gradient(140deg,#13255cdd,#0d1947dd);border:1px solid #35539c;border-radius:20px;padding:20px;box-shadow:0 15px 50px #0002}.card.sm{grid-column:span 3}.card.md{grid-column:span 6}.card h2{margin:0 0 8px}.muted{color:var(--muted)}.metric{font-size:34px;font-weight:800;margin-top:8px}.pill{display:inline-block;padding:6px 10px;border:1px solid #4362ad;border-radius:999px;color:#cde0ff;font-size:12px;margin:3px}.btn{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(90deg,#55d7ff,#946bff);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#16285f;border:1px solid #3e5da6}.btn:disabled{opacity:.5}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid #22386f;text-align:left;font-size:14px}.bar{height:9px;background:#1b2c61;border-radius:99px;overflow:hidden}.bar > div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple))}.level{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.level button{padding:12px;border:1px solid #36559b;background:#0e1a45;color:#bbcff8;border-radius:12px;cursor:pointer}.level button.selected{border-color:var(--cyan);background:#16316b;color:#fff;box-shadow:0 0 15px #55d7ff22}.notice{padding:12px 14px;border-radius:12px;background:#122354;border:1px solid #36539c;color:#d5e4ff}.danger{border-color:#a16a37;background:#30281a}.success{border-color:#367e68;background:#123129}.hidden{display:none!important}.status{position:fixed;right:18px;bottom:18px;padding:10px 14px;border-radius:12px;background:#081333f2;border:1px solid #3d5ba4;color:#bcd2ff;font-size:12px}.loading{opacity:.65}.scorebox{display:flex;align-items:center;gap:20px}.bigscore{font-size:52px;font-weight:900}.dropzone{border:1px dashed #5273c1;border-radius:16px;padding:20px;text-align:center;background:#0c1a47}.timeline{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start}.week{font-weight:800;color:#78a9ff}
.alignment-hero{padding:28px;border-radius:24px;border:1px solid #4162b0;background:radial-gradient(circle at 92% 12%,#6e5bff33 0,#13275d 38%,#0c1946 100%);box-shadow:0 20px 70px #0004;overflow:hidden;position:relative}.alignment-hero:after{content:"";position:absolute;right:-100px;bottom:-100px;width:300px;height:300px;border:1px solid #55d7ff33;border-radius:50%;box-shadow:0 0 0 40px #55d7ff0a,0 0 0 80px #946bff08}.hub-kicker{font-size:11px;letter-spacing:2.5px;color:#7fb8ff;font-weight:800}.hub-title{font-size:36px;font-weight:900;line-height:1.1;margin:8px 0}.hub-title span{background:linear-gradient(90deg,#55d7ff,#a581ff);-webkit-background-clip:text;background-clip:text;color:transparent}.hub-sub{max-width:820px;color:#aac2ef;font-size:15px;line-height:1.55}.hub-flow{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr 28px 1fr;align-items:center;margin-top:24px}.flow-step{padding:15px;border:1px solid #36559c;border-radius:16px;background:#091744aa;min-height:84px}.flow-step.active{border-color:#55d7ff66;box-shadow:0 0 24px #55d7ff11}.flow-number{font-size:10px;color:#77a9ff;letter-spacing:1.5px;margin-bottom:5px}.flow-step b{display:block;font-size:14px}.flow-step span{display:block;margin-top:4px;color:#83a5de;font-size:11px}.flow-line{height:1px;background:linear-gradient(90deg,#36559c,#55d7ff,#946bff);opacity:.65}.hub-metrics{margin-top:16px}.hub-big{font-size:38px;font-weight:900;margin:5px 0}.hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hub-grid>.card{grid-column:auto}.hub-panel{min-height:100%}.hub-badge{font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:7px 10px;border:1px solid #3c5ca7;border-radius:999px;color:#9ec0f7}.hub-badge.danger{border-color:#a76853;color:#ffc5ad}.demand-list{margin-top:12px}.demand-row{display:grid;grid-template-columns:26px 1fr 1.1fr 50px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #20366d}.hub-rank{font-size:12px;color:#76a9ff}.demand-name{display:flex;flex-direction:column;gap:2px}.demand-name .muted{font-size:11px}.demand-bar,.gap-track{height:7px;border-radius:99px;background:#17285a;overflow:hidden}.demand-bar div{height:100%;background:linear-gradient(90deg,#55d7ff,#946bff);border-radius:99px}.gap-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #20366d}.gap-severity{font-size:9px;letter-spacing:1px;padding:5px 7px;border:1px solid #a7664f;color:#ffc1a4;border-radius:999px}.gap-track{margin:7px 0 6px}.gap-track div{height:100%;background:linear-gradient(90deg,#ffb76b,#ff6f91);border-radius:99px}.hub-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.hub-mini-card{border:1px solid #314c95;border-radius:15px;background:#0a1844;padding:13px}.hub-mini-top{display:flex;gap:9px;align-items:flex-start}.hub-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:#2a214b;color:#b596ff;font-weight:900}.hub-icon.warn{background:#3a2920;color:#ffc06e}.hub-course{margin-top:11px;padding-top:10px;border-top:1px solid #22396f;display:flex;flex-direction:column;gap:3px;font-size:12px}.hub-cta{margin-top:13px;padding:14px 16px;border-radius:16px;border:1px solid #3c5ca5;background:linear-gradient(90deg,#0c1d4c,#17265a);display:flex;justify-content:space-between;align-items:center;gap:16px}.job-list{margin-top:12px}.job-row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #20366d}.job-match{font-size:21px;font-weight:900}.job-match span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#76a7e6}.job-main{display:flex;flex-direction:column;gap:2px}.job-main>span{font-size:12px;color:#91ade2}.hub-footer{display:flex;justify-content:space-between;align-items:center;gap:20px}.hub-footer h2{margin:7px 0 5px}.hub-footer p{margin:0;max-width:760px}

@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;max-height:250px}.grid .card.sm,.grid .card.md{grid-column:span 12}.hub-grid{grid-template-columns:1fr}.hub-mini-grid{grid-template-columns:1fr}.hub-flow{grid-template-columns:1fr;gap:8px}.flow-line{display:none}.hub-title{font-size:30px}.title{font-size:32px}.main{padding:18px}}

.login-wrap{min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(circle at 82% 12%,#243a99 0,#111d58 30%,#09153b 72%,#07112c 100%)}
.login-card{width:min(980px,96vw);display:grid;grid-template-columns:1.05fr .95fr;border:1px solid #3b5aa8;border-radius:26px;overflow:hidden;background:#0a1740f5;box-shadow:0 30px 90px #0007}.login-hero{padding:44px;background:linear-gradient(145deg,#10235c,#0b1740)}.login-panel{padding:34px;background:#0a1539}.login-title{font-size:38px;font-weight:900;line-height:1.05;margin:24px 0 10px}.login-tag{font-size:16px;color:#9eb9f5;line-height:1.6}.role-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:18px 0}.role-btn{padding:13px 10px;border:1px solid #36559c;border-radius:13px;background:#0c1a47;color:#aec4ef;cursor:pointer;text-align:left}.role-btn.active{background:#17336f;color:#fff;border-color:var(--cyan);box-shadow:0 0 18px #55d7ff22}.field{margin-top:13px}.field label{display:block;font-size:12px;color:#89a9e9;margin-bottom:6px}.field input{width:100%;min-width:0}.login-actions{margin-top:18px}.login-hint{margin-top:16px;padding:12px;border:1px solid #2d4b8d;border-radius:12px;background:#0c1a47;color:#9eb7ea;font-size:12px;line-height:1.5}.role-desc{min-height:36px;color:#7fa1e0;font-size:12px;margin-top:5px}.identity-note{font-size:11px;color:#6f93d8;margin-top:5px}.login-divider{display:flex;align-items:center;gap:10px;margin:20px 0 4px;color:#6f93d8;font-size:11px}.login-divider:before,.login-divider:after{content:"";height:1px;background:#2b4386;flex:1}.role-badge{display:inline-block;padding:6px 10px;border:1px solid #3d5da7;border-radius:999px;color:#bcd4ff;font-size:11px;letter-spacing:1.2px;text-transform:uppercase}.demo-credentials{margin-top:4px;padding:14px;border:1px solid #2d4b8d;border-radius:14px;background:#0c1a47}.copy-row{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;margin-top:8px;padding:9px 10px;border:1px solid #263f7a;border-radius:10px;background:#091743}.copy-label{color:#89a9e9;font-size:11px;text-transform:uppercase;letter-spacing:.8px}.copy-row code{font-family:Consolas,monospace;color:#edf5ff;font-size:12px;overflow-wrap:anywhere}.copy-btn{border:1px solid #3e5da6;background:#16285f;color:#dce8ff;border-radius:8px;padding:6px 9px;cursor:pointer;font-weight:700}.copy-btn:hover{border-color:var(--cyan)}.quick-demo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick-demo{padding:13px;border:1px solid #36559c;border-radius:12px;background:#0a1844;color:#fff;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:3px 8px}.quick-demo span{font-size:11px;color:#8faee9;grid-column:1/2}.quick-demo em{font-style:normal;color:#55d7ff;font-size:11px;grid-column:2;grid-row:1/3;align-self:center}.quick-demo:hover{border-color:var(--cyan);background:#12285a}
@media(max-width:850px){.login-card{grid-template-columns:1fr}.login-hero{display:none}}
</style>
</head>
<body>
<div id="loginScreen"></div>
<div id="appShell" class="app hidden">
  <aside class="sidebar">
    <div class="brand">Kaushal<span>Pulse</span><div style="font-size:10px;font-weight:600;letter-spacing:1.5px;color:#7fa1e0;margin-top:4px">DISHA FOR YOUR SKILLS</div></div>
    <div id="navMount"></div>
    <div style="margin-top:20px;padding:12px;border:1px solid #294382;border-radius:14px;background:#0a1740">
      <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:1.5px">Signed in as</div>
      <div id="signedUser" style="font-weight:800;margin-top:4px"></div>
      <div id="signedRole" class="muted" style="font-size:12px;margin-top:2px"></div>
      <button class="btn secondary" style="width:100%;margin-top:10px" onclick="logout()">Sign out</button>
    </div>
  </aside>
  <main class="main">
    <div class="top"><div><div class="eyebrow">STUDENT-FIRST WORKFORCE NAVIGATOR</div><div class="title" id="greeting">Welcome to KaushalPulse</div><div class="subtitle" id="subtitle">Disha for your skills.</div></div><div class="row"><button class="btn secondary" onclick="refreshAll()">Refresh</button></div></div>
    <div class="tenantbar"><div class="tenantdot"></div><div><div class="tenantmeta">CURRENT MARKET</div><div id="marketLabel" class="tenantname">Loading…</div><div class="muted" style="font-size:11px;margin-top:3px">Account access: <span id="activeTenant">Registered account</span></div></div><div class="selectors" id="tenantSelectors"><select id="marketStateSelect" class="select" aria-label="State"></select><select id="marketDistrictSelect" class="select" aria-label="District"></select></div></div>
    <div id="page"></div>
  </main>
</div><div id="status" class="status">Starting…</div>
<script src="app.js"></script>
</body></html>
